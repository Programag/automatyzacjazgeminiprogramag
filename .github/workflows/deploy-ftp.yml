# Wgrywa PaperlyAI na hosting przez FTP po każdej zmianie na wskazanych gałęziach
# oraz na żądanie (Actions -> "Wgraj na FTP" -> Run workflow).
#
# Wgrywane pliki: aplikacja (index.html), strony informacyjne (o-aplikacji, prywatnosc, regulamin),
# serwer PHP (api/) oraz api/_config.php tworzony z sekretów (nigdy nie trafia do repozytorium).
#
# Dane dostępowe NIE są w kodzie. Ustaw je w repozytorium:
# Settings -> Secrets and variables -> Actions -> New repository secret
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   dostęp FTP (wymagane)
#   FTP_DIR, FTP_PROTOCOL                    (opcjonalnie) folder strony i protokół (domyślnie / i ftps)
# Serwer PaperlyAI (opcjonalnie – bez nich aplikacja działa w przeglądarce jak dotąd):
#   DB_HOST, DB_NAME, DB_USER, DB_PASS       baza MySQL z panelu hostingu
#   APP_SECRET                               losowy ciąg (min. 32 znaki) do szyfrowania tokenów
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   logowanie Google i Gmail bez ponownego logowania
#   GEMINI_API_KEY, DAILY_LIMIT              klucz AI firmy i dzienny limit zapytań na osobę
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM, MAIL_FROM_NAME   e-maile z własnej domeny
#   GUS_KEY                                  klucz do rejestru REGON (bez niego: wykaz VAT MF)
#   OPERATOR_NAME, OPERATOR_ADDRESS, OPERATOR_NIP, CONTACT_EMAIL, SITE_HOST  dane do polityki prywatności i regulaminu
name: Wgraj na FTP

on:
  push:
    branches:
      - main
      - claude/sleepy-galileo-wyv13q
    paths:
      - index.html
      - o-aplikacji.html
      - prywatnosc.html
      - regulamin.html
      - site.css
      - site.js
      - .htaccess
      - 'api/**'
      - '.github/scripts/**'
      - .github/workflows/deploy-ftp.yml
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Sprawdź, czy ustawiono dane FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Brak sekretów w repozytorium:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Przygotuj pliki do wgrania
        env:
          OPERATOR_NAME: ${{ secrets.OPERATOR_NAME }}
          OPERATOR_ADDRESS: ${{ secrets.OPERATOR_ADDRESS }}
          OPERATOR_NIP: ${{ secrets.OPERATOR_NIP }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SITE_HOST: ${{ secrets.SITE_HOST || 'paperlyai.pl' }}
        run: |
          mkdir -p _site
          cp index.html o-aplikacji.html prywatnosc.html regulamin.html site.css site.js .htaccess _site/
          cp -r api _site/api
          rm -f _site/api/_config.php
          python3 .github/scripts/fill-pages.py _site
          test -s _site/index.html && test -s _site/api/index.php

      - name: Utwórz konfigurację serwera z sekretów
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_LIMIT: ${{ secrets.DAILY_LIMIT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          GUS_KEY: ${{ secrets.GUS_KEY }}
        run: |
          python3 .github/scripts/make-config.py _site/api/_config.php
          php -l _site/api/_config.php > /dev/null && echo "Konfiguracja serwera poprawna"

      - name: Przygotuj dane logowania (usuń przypadkowe spacje i znaki nowej linii)
        id: creds
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
          RAW_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          server="$(trim "$RAW_SERVER")"; server="${server#ftp://}"; server="${server#ftps://}"; server="${server%/}"
          user="$(trim "$RAW_USER")"
          pass="$(trim "$RAW_PASS")"
          echo "::add-mask::$user"
          echo "::add-mask::$pass"
          echo "Serwer: ${server} | długość loginu: ${#user} (w sekrecie: ${#RAW_USER}) | długość hasła: ${#pass} (w sekrecie: ${#RAW_PASS})"
          [ "${#user}" -ne "${#RAW_USER}" ] && echo "::warning::Login miał spacje lub znaki nowej linii na brzegach – usunięto je."
          [ "${#pass}" -ne "${#RAW_PASS}" ] && echo "::warning::Hasło miało spacje lub znaki nowej linii na brzegach – usunięto je."
          {
            echo "server=$server"
            echo "username=$user"
            echo "password=$pass"
          } >> "$GITHUB_OUTPUT"

      - name: Wgraj przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.creds.outputs.server }}
          username: ${{ steps.creds.outputs.username }}
          password: ${{ steps.creds.outputs.password }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          local-dir: ./_site/
          dry-run: false
